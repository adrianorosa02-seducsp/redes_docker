version: "3.8"

services:

  ti-terminal:
    image: alpine:3.22
    hostname: ti-terminal

    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache ttyd bash openssh-client iproute2 iputils curl wget netcat-openbsd traceroute bind-tools

        exec ttyd -W -p 7681 \
          -t fontSize=16 \
          -t cursorBlink=true \
          bash -c '
            clear
            echo "=============================================="
            echo "       LABORATORIO DE REDES - ti"
            echo "=============================================="
            echo ""
            echo "Terminal inicial do laboratorio."
            echo ""
            echo "Servidor:"
            echo "    lab-server"
            echo ""
            echo "Acesso SSH:"
            echo "    ssh aluno@lab-server"
            echo ""
            echo "Usuario:"
            echo "    aluno"
            echo ""
            echo "=============================================="
            echo ""
            exec bash
          '

    networks:
      - dockermaster
      - lab_backend

    deploy:
      replicas: 1

      resources:
        limits:
          memory: 128M

      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=dockermaster"
        - "traefik.http.routers.lab-ti.rule=Host(`lab-ti.inetz.com.br`)"
        - "traefik.http.routers.lab-ti.entrypoints=websecure"
        - "traefik.http.routers.lab-ti.tls=true"
        - "traefik.http.routers.lab-ti.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.lab-ti.loadbalancer.server.port=7681"


  lab-server:
    image: ubuntu:24.04
    hostname: lab-server

    environment:
      LAB_USER: aluno
      LAB_PASSWORD: "Laboratorio@123"

    command:
      - /bin/bash
      - -c
      - |
        export DEBIAN_FRONTEND=noninteractive

        apt-get update

        apt-get install -y \
          openssh-server \
          iproute2 \
          iputils-ping \
          net-tools \
          curl \
          wget \
          dnsutils \
          netcat-openbsd \
          traceroute \
          vim \
          nano \
          sudo

        mkdir -p /run/sshd

        if ! id "$$LAB_USER" >/dev/null 2>&1; then
          useradd -m -s /bin/bash "$$LAB_USER"
        fi

        echo "$$LAB_USER:$$LAB_PASSWORD" | chpasswd

        usermod -aG sudo "$$LAB_USER"

        sed -i 's/^#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
        sed -i 's/^PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config

        grep -q "^PasswordAuthentication yes" /etc/ssh/sshd_config || \
          echo "PasswordAuthentication yes" >> /etc/ssh/sshd_config

        cat > /etc/motd <<'EOF'

        ==============================================
             LAB-SERVER
        ==============================================

        Servidor de laboratorio da empresa.

        Usuario:
            aluno

        Acesso:
            SSH

        Departamento:
            Recursos Humanos

        ==============================================

        EOF

        ssh-keygen -A

        echo ""
        echo "=============================================="
        echo "          LAB-SERVER PRONTO"
        echo "=============================================="
        echo ""
        echo "Hostname: lab-server"
        echo "Usuario:  aluno"
        echo "SSH:      ativo"
        echo ""
        echo "=============================================="
        echo ""

        exec /usr/sbin/sshd -D -e

    networks:
      - lab_backend

    deploy:
      replicas: 1

      resources:
        limits:
          memory: 512M


networks:

  dockermaster:
    external: true

  lab_backend:
    driver: overlay
    attachable: true
